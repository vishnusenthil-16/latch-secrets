name: Publish macOS Homebrew release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag matching Cargo.toml (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate code and release tooling
        run: |
          cargo fmt --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Prepare immutable source bundle
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/prepare_release.py --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" --output "$RUNNER_TEMP/latch-release"
          python3 scripts/verify_release.py --bundle "$RUNNER_TEMP/latch-release" --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY"
      - name: Exercise Homebrew formula in an isolated prefix
        env:
          HOMEBREW_DEVELOPER: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: brew ruby scripts/check_homebrew.rb "$RUNNER_TEMP/latch-release"
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-release
          path: ${{ runner.temp }}/latch-release/
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: homebrew-release
          path: ${{ runner.temp }}/bundle
      - name: Verify and publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/prepare_release.py --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" --output "$RUNNER_TEMP/expected-release"
          python3 scripts/verify_release.py --bundle "$RUNNER_TEMP/bundle" --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" --expected "$RUNNER_TEMP/expected-release"
          SOURCE_SHA=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' "$RUNNER_TEMP/bundle/release.json")
          TAG_SHA=$(gh api "repos/$RELEASE_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          test "$SOURCE_SHA" = "$TAG_SHA"
          python3 scripts/publish_release.py --bundle "$RUNNER_TEMP/bundle" --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY"

  homebrew:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew.yml
    secrets: inherit
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      tap_repository: vishnusenthil-16/homebrew-tap
