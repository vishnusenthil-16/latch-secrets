name: Publish Homebrew tap update

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      tap_repository:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (vX.Y.Z)
        required: true
        type: string
      tap_repository:
        description: Existing tap repository (owner/homebrew-tap)
        default: vishnusenthil-16/homebrew-tap
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-${{ inputs.tap_repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: homebrew
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate published release against tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          TAP_REPOSITORY: ${{ inputs.tap_repository }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', os.environ['RELEASE_TAG']), 'Invalid tag'
          assert re.fullmatch(r'[A-Za-z0-9_.-]+/homebrew-[A-Za-z0-9_.-]+', os.environ['TAP_REPOSITORY']), 'Invalid tap repository'
          PY
          gh release view "$RELEASE_TAG" --repo "$SOURCE_REPOSITORY" --json isDraft,isPrerelease > "$RUNNER_TEMP/release-state.json"
          python3 -c 'import json,sys; x=json.load(open(sys.argv[1])); assert not x["isDraft"] and not x["isPrerelease"], "Release must be published and stable"' "$RUNNER_TEMP/release-state.json"
          gh release download "$RELEASE_TAG" --repo "$SOURCE_REPOSITORY" --dir "$RUNNER_TEMP/bundle" --pattern '*.tar.gz' --pattern latch-secrets.rb --pattern SHA256SUMS --pattern release.json
          mkdir "$RUNNER_TEMP/bundle/Formula"
          mv "$RUNNER_TEMP/bundle/latch-secrets.rb" "$RUNNER_TEMP/bundle/Formula/latch-secrets.rb"
          python3 source/scripts/prepare_release.py --tag "$RELEASE_TAG" --repository "$SOURCE_REPOSITORY" --output "$RUNNER_TEMP/expected-release"
          python3 source/scripts/verify_release.py --bundle "$RUNNER_TEMP/bundle" --tag "$RELEASE_TAG" --repository "$SOURCE_REPOSITORY" --expected "$RUNNER_TEMP/expected-release"
          SOURCE_SHA=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' "$RUNNER_TEMP/bundle/release.json")
          TAG_SHA=$(gh api "repos/$SOURCE_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          test "$SOURCE_SHA" = "$TAG_SHA"
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tap_repository }}
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          fetch-depth: 0
          path: tap
      - name: Publish verified formula to tap default branch
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        working-directory: tap
        run: |
          test -n "$TAP_TOKEN"
          python3 ../source/scripts/update_tap.py --formula "$RUNNER_TEMP/bundle/Formula/latch-secrets.rb" --tag "$RELEASE_TAG"
