[package]
name = "latch-secrets"
version = "0.2.0"
edition = "2024"
description = "Agent-friendly Vaultwarden credentials through the Bitwarden CLI"
license = "Apache-2.0"
readme = "README.md"

[[bin]]
name = "latch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
libc = "0.2"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"
uuid = "1"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
dotenvy = "0.15"
