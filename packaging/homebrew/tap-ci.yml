# Copy into the tap repository as .github/workflows/check.yml.
name: Homebrew formula
on: [push, pull_request]
permissions:
  contents: read
jobs:
  formula:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
      HOMEBREW_NO_ASK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install and test the checked-out formula
        run: |
          TAP="${GITHUB_REPOSITORY/\/homebrew-/\/}"
          FORMULA="$TAP/latch-secrets"
          brew tap --custom-remote "$TAP" "$GITHUB_WORKSPACE"
          brew trust --formula "$FORMULA"
          brew install --build-from-source --formula "$FORMULA"
          brew audit --strict --formula "$FORMULA"
          brew test "$FORMULA"
