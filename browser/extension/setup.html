<!doctype html>
<html><head><meta charset="utf-8"><title>Latch setup</title></head>
<body style="min-width:300px;font:14px system-ui;padding:12px">
<h2>Latch browser access</h2>
<p>Grant access only to sites you want Latch to fill. Latch never submits forms.</p>
<label>HTTPS site <input id="site" type="url" placeholder="https://example.com"></label>
<button id="grant">Allow site</button>
<p><label>Profile label <input id="label" maxlength="80" placeholder="Personal Chrome"></label>
<button id="save">Save label</button></p>
<button id="connect">Connect to Latch</button><p id="status" role="status"></p>
<script type="module" src="setup.js"></script></body></html>
